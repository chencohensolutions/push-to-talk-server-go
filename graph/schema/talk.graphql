# --- Live talk (phase 5b) -----------------------------------------------------------------------------------------
# See docs/messaging.md, "Live talk". Each conversation has a LiveKit room; ptt-server signs a phone's token after the
# same checks as talking there, and passes LiveKit's signalling through /rtc on this port (mTLS), so only enrolled
# devices reach it. Media goes to LiveKit's own ports, encrypted end to end with the talk keys the phones swap.
#
# Errors a device acts on carry a code in extensions.code: NOT_ENROLLED, LIVE_OFF, NOT_PAIRED, BLOCKED, NOT_MEMBER,
# UNKNOWN_USER, INVALID.

extend type Mutation {
  """
  A token to join the LiveKit room of the conversation with peer (a contact only: a fellow group member who isn't one
  is reached in the group) or of group (one of the two), for 10 minutes, as identity "user.device". The phone
  connects LiveKit's client to this server's address with the path /rtc. LIVE_OFF when the server has no LiveKit.
  """
  talkToken(peer: String, group: ID): TalkToken!
  """
  Deletes a push the server's recorder kept for members who weren't in the talk room (docs/messaging.md, "Talk
  buffer"), at once, whoever has or hasn't read it: only its talker may (2026-11-25, hen: the sender can take back a
  push nobody heard live yet). The phones that already have it are told by an end-to-end delete, like a message's.
  NOT_FOUND when there is no such buffer of the caller's.
  """
  deleteTalkBuffer(id: ID!): Boolean!
  """
  A token to join call's own LiveKit room (phase 6, video calls), in the conversation with peer or group, after the
  same checks; call is 32 hex digits the caller's phone made and sent in its encrypted call invite, with the call's
  fresh media key. The first callToken binds the id to its conversation (INVALID for another one). The room takes at
  most livekit.max_call_devices from config.json (32 by default). The call isn't kept unless someone in it records it
  (recordCall). LIVE_OFF without LiveKit.
  """
  callToken(call: ID!, peer: String, group: ID): TalkToken!
}

extend type ServerInfo {
  "The server has the live talk path (LiveKit): talkToken works."
  liveTalk: Boolean!
}

type TalkToken {
  "LiveKit's access token."
  token: String!
  room: String!
  identity: String!
  "The path on this server to give LiveKit's client: /rtc."
  path: String!
  expiresAt: Time!
}

# --- Saved calls (2026-11-22) --------------------------------------------------------------------------------------
# See docs/messaging.md, "Saved calls". 2026-11-22 (hen): a call is kept only while someone in it records it. From a
# participant's recordCall until stopRecordingCall, or until the device that started it leaves the call, the server
# is in the call's room as a hidden participant and keeps each participant's audio and video exactly as LiveKit
# carried them, still encrypted end to end with the call's key, and deletes them keep_call_days days (default 7)
# after the recording starts. The room's metadata carries
# the keeping state to the phones in the call. The phones in the call download and decrypt the tracks, without re-encoding. Codes: as
# callToken, plus RECORDING_OFF when this server doesn't keep calls and NOT_IN_CALL when the caller's device isn't in
# the call's room.

extend type Mutation {
  """
  Start keeping call, from the caller's device, which must be in the call's room now. Already recorded: the recording
  that goes on is answered. Once the recorder is in the room, the room's metadata (which LiveKit sends to every phone
  in the call) is {"recording": true, "by": "user.device", "startedAt": "<RFC 3339>"}; the phones use it to know the
  call is being kept, and show nothing to anyone about it.
  """
  recordCall(call: ID!, peer: String, group: ID): CallRecording!
  """
  Stop keeping call: anyone in the call's room may stop it. The room's metadata becomes {"recording": false}. It also
  stops when the device that started it leaves, after 4 hours, or when the room empties.
  """
  stopRecordingCall(call: ID!, peer: String, group: ID): CallRecording!
  """
  Add an event (base64, 1 to 4096 bytes, encrypted end to end with the call's key) to the caller's device's event log
  in call, while it is kept: how this phone shows each video (Fill or Fit, the tile's shape) or which way its camera
  is turned. Each device's log is a RecordedTrack of kind "events" and codec application/x-talk-events, timed like
  the other tracks, so a saved call can replay the crops. NOT_RECORDING when the call isn't being kept; NOT_IN_CALL
  as recordCall.
  """
  logCallEvent(call: ID!, peer: String, group: ID, event: String!): Boolean!
}

extend type Query {
  "A call's saved streams so far, for whoever may read them (who was in the call), and whether it is kept now."
  callRecording(call: ID!, peer: String, group: ID): CallRecording!
}

extend type ServerInfo {
  "The server can keep calls (livekit.keep_calls): the call screen offers Record."
  keepsCalls: Boolean!
}

type CallRecording {
  call: ID!
  "The server is keeping the call now."
  recording: Boolean!
  "Who records it now or recorded it last since the server started (user.device); null when not known."
  by: String
  "When keeping began; every track record's timestamp counts from here. Null when the call was never kept."
  startedAt: Time
  tracks: [RecordedTrack!]!
}

"""
One participant's audio or video in a kept call, read with GET /blob/<blob>: records of a 4-byte big-endian length,
then 8 bytes of big-endian microseconds since its recordingStartedAt, 1 byte of flags (1: a key frame), and the
frame as the sender's LiveKit encrypted it.
"""
type RecordedTrack {
  blob: ID!
  "The participant, user.device."
  identity: String!
  "audio, video, or events (a device's event log: logCallEvent)."
  kind: String!
  "The codec's MIME type: audio/opus, video/VP8 or video/H264."
  codec: String!
  "When its first frame arrived."
  startedAt: Time!
  """
  When the keeping it belongs to began: its records' timestamps count from here. A call rejoined after everyone left
  is kept again from a new start, so line tracks up by this, not by CallRecording.startedAt.
  """
  recordingStartedAt: Time!
  size: Int!
  "No more frames will come."
  complete: Boolean!
}
