# Admin API, served only on the loopback admin listener (admin_addr) and used by the
# `ptt-server user add | user remove | users | enroll-code | devices | revoke | livekit update | app-update` commands. See docs/authentication.md.

scalar Time

type Query {
  "The users (users.json), by name."
  users: [User!]!
  "Enrolled devices, oldest first; all users when user is omitted."
  devices(user: String): [Device!]!
}

type Mutation {
  "Adds a user to users.json; devices then enroll as it with codes from createEnrollmentCode."
  addUser(name: String!): User!
  "Removes a user from users.json and revokes every certificate of its devices."
  removeUser(name: String!): RemovedUser!
  "Creates a one-time enrollment code for an existing user."
  createEnrollmentCode(user: String!): EnrollmentCode!
  "Revokes an enrolled device's certificate (and its renewals); the server rejects it from then on."
  revokeDevice(serial: String!): Device!
  """
  Stops livekit-server and starts it again at once, so a new program (`ptt-server livekit update`) runs. False when
  this server doesn't run LiveKit itself (no "livekit" in config.json, or its binary is "none").
  """
  restartLiveKit: Boolean!
  """
  Reads the app's latest GitHub release now (`ptt-server app-update`), instead of waiting for the hourly read. A
  release the server hadn't seen is pushed to every phone as app_update; with push, the release is pushed either way
  (`ptt-server app-update --push`). Fails when config.json's app_releases is "none" or GitHub can't be read.
  """
  checkAppRelease(push: Boolean! = false): AppReleaseCheck!
}

"What checkAppRelease found."
type AppReleaseCheck {
  tag: String!
  version: String!
  "The server hadn't seen this release before."
  new: Boolean!
  "How many devices were pushed app_update (devices with an FCM token); 0 when nothing was sent."
  pushed: Int!
}

type User {
  name: String!
  addedAt: Time!
  "Its devices that aren't revoked."
  devices: Int!
}

type RemovedUser {
  name: String!
  "How many certificates were revoked with it."
  revokedDevices: Int!
}

type EnrollmentCode {
  code: String!
  user: String!
  expiresAt: Time!
  "public_url from config.json, if set."
  serverUrl: String
}

type Device {
  serial: String!
  user: String!
  name: String!
  deviceNumber: Int!
  keyProtection: String!
  registeredAt: Time!
  expiresAt: Time!
  revokedAt: Time
  "The certificate this one renewed, if any."
  renewedFrom: String
}
